name: Sync Upstream and Build Docker Image

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00），实际启动时间可能延迟。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build without upstream changes'
        required: false
        type: boolean
        default: false

# 避免两次同步同时推送，或较旧镜像覆盖 latest。
concurrency:
  group: sync-and-build-master
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  sync_and_build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout latest master
        uses: actions/checkout@v5
        with:
          ref: master
          # SYNC_TOKEN 需要 Contents 和 Workflows 的读写权限。
          # 没有该 Secret 时，仍可用内置令牌同步不涉及工作流的更新。
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          fetch-depth: 0

      - name: Sync upstream and decide whether to build
        id: sync
        env:
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/dataabc/weibo-crawler.git
          git fetch --no-tags upstream master

          before=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/master; then
            echo '::error::Upstream merge failed. Resolve the merge conflict before retrying.'
            git diff --name-only --diff-filter=U
            exit 1
          fi
          after=$(git rev-parse HEAD)

          if [[ "$before" != "$after" ]]; then
            if [[ "$HAS_SYNC_TOKEN" != 'true' ]] &&
               ! git diff --quiet "$before" "$after" -- .github/workflows/; then
              echo '::error::Upstream changes workflow files. Add the SYNC_TOKEN repository secret with Contents: Read and write and Workflows: Read and write, then start a new workflow run.'
              exit 1
            fi
            git push origin HEAD:refs/heads/master
          fi

          build_required=false
          if [[ "$before" != "$after" || "$FORCE_BUILD" == 'true' || "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then
            build_required=true
          fi

          echo "sha=$after" >> "$GITHUB_OUTPUT"
          echo "build_required=$build_required" >> "$GITHUB_OUTPUT"
          {
            echo '### Upstream sync'
            echo "- Commit before sync: \`$before\`"
            echo "- Commit after sync: \`$after\`"
            echo "- Build requested: \`$build_required\`"
            if [[ "$build_required" == 'false' ]]; then
              echo '- No upstream updates; image build skipped.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Docker build
        id: image
        if: steps.sync.outputs.build_required == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ steps.sync.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -f deploy/Dockerfile ]]; then
            dockerfile=deploy/Dockerfile
          elif [[ -f Dockerfile ]]; then
            dockerfile=Dockerfile
          else
            echo '::error::Neither deploy/Dockerfile nor Dockerfile exists.'
            exit 1
          fi
          image="ghcr.io/${REPOSITORY,,}"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image:latest"
            echo "$image:sha-$BUILD_SHA"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.sync.outputs.build_required == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.sync.outputs.build_required == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.sync.outputs.build_required == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        if: steps.sync.outputs.build_required == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=weibo-crawler
          cache-to: type=gha,mode=max,scope=weibo-crawler
          provenance: false

      - name: Summarize published image
        if: steps.build.outcome == 'success'
        env:
          REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ steps.sync.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published Docker image'
            echo "- Image: \`ghcr.io/${REPOSITORY,,}:latest\`"
            echo "- Commit tag: \`ghcr.io/${REPOSITORY,,}:sha-$BUILD_SHA\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo '- Platforms: linux/amd64, linux/arm64'
          } >> "$GITHUB_STEP_SUMMARY"
